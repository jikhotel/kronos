<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 · Kronos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d1117; color: #e6edf3; min-height: 100vh;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px;
}
.panel {
  width: 380px; background: #161b22; border: 1px solid #21262d; border-radius: 14px;
  padding: 34px 32px;
}
h2 { font-size: 19px; margin-bottom: 22px; }
.item { margin-bottom: 16px; }
.item label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 7px; }
.item input {
  width: 100%; background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
  border-radius: 8px; padding: 10px 14px; font-size: 15px; outline: none;
}
.item input:focus { border-color: #58d5f0; }
.btn {
  width: 100%; background: #1f6feb; color: #fff; border: none; border-radius: 8px;
  padding: 11px; font-size: 15.5px; cursor: pointer; margin-top: 6px; font-weight: 500;
}
.btn:hover { filter: brightness(1.12); }
.msg { font-size: 13.5px; margin-top: 12px; min-height: 20px; }
.ok { color: #3fb950; } .err { color: #f85149; }
.nav { margin-top: 26px; font-size: 13.5px; }
.nav a { color: #58d5f0; text-decoration: none; margin: 0 10px; }
</style>
</head>
<body>
<div class="panel">
  <h2>🔑 修改密码 · {{ u.username }}</h2>
  <div class="item"><label>原密码</label><input id="old" type="password"></div>
  <div class="item"><label>新密码(≥6位)</label><input id="new1" type="password"></div>
  <div class="item"><label>确认新密码</label><input id="new2" type="password"></div>
  <button class="btn" onclick="chg()">保存修改</button>
  <div class="msg" id="msg"></div>
</div>
<div class="nav">
  <a href="/">首页</a><a href="/quant">量化交易</a><a href="/logout">退出登录</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
async function chg() {
  const m = document.getElementById('msg');
  const n1 = document.getElementById('new1').value, n2 = document.getElementById('new2').value;
  if (n1 !== n2) { m.className = 'msg err'; m.textContent = '两次新密码不一致'; return; }
  const res = await axios.post('/api/change-password', {
    old_password: document.getElementById('old').value, new_password: n1 });
  m.className = 'msg ' + (res.data.success ? 'ok' : 'err');
  m.textContent = res.data.message || res.data.error;
}
</script>
</body>
</html>
